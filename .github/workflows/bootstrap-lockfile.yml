# One-off workflow, removed from the branch after lockfile is created.
name: Bootstrap dependency lockfile (temporary)
on:
  push:
    branches: [feature/quality-sprint-20261119]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Resolve dependencies into a committed npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit reproducible dependency lockfile to the feature branch
        run: |
          test -s package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: lock npm workspace dependencies"
            git push origin HEAD:feature/quality-sprint-20261119
          fi
