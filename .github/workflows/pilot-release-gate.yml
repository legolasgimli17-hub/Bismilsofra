name: Controlled pilot release evidence gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-readiness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Block pilot until all 12 real-world checks have evidence
        run: node tools/pilot-release-gate.mjs --require-go
