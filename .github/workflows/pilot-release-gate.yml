name: Controlled pilot release evidence gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-readiness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Block pilot until all 12 real-world checks have evidence
        run: node tools/pilot-release-gate.mjs --require-go
