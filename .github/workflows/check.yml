name: Tests and frontend build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Core backend tests
        run: npm run test:api
      - name: Frontend cart tests
        run: npm run test:cart
      - name: Product customization selection and editor draft tests
        run: npm run test:product-options
      - name: Historical order replay safety tests
        run: npm run test:reorder
      - name: Discovery and favorites tests
        run: npm run test:discovery
      - name: Merchant connection health tests
        run: npm run test:inbox
      - name: Browser real-time stream parser tests
        run: npm run test:realtime
      - name: Spreadsheet menu import preview tests
        run: npm run test:menu-import
      - name: Restaurant menu search and category tests
        run: npm run test:menu-discovery
      - name: Recent completed order selector tests
        run: npm run test:recent-orders
      - name: Merchant workflow tests
        run: npm run test:merchant
      - name: Merchant operations form and currency tests
        run: npm run test:merchant-settings
      - name: Staging URL guard tests (cannot probe production)
        run: node --test tools/staging-target.test.mjs
      - name: Validate isolated staging compose topology
        env:
          STAGING_DB_PASSWORD: ci-test-only
          STAGING_DATABASE_URL: postgresql://sofra_staging:ci-test-only@db:5432/bismil_sofra_staging
          STAGING_CORS_ORIGIN: https://app-staging.example.invalid
          STAGING_OIDC_ISSUER: https://oidc-staging.example.invalid/
          STAGING_OIDC_AUDIENCE: staging-ci-only
          STAGING_OIDC_JWKS_URL: https://oidc-staging.example.invalid/.well-known/jwks.json
        run: docker compose -f deploy/staging.compose.yml config --quiet
      - name: Authenticated backup encryption, corruption and key safety tests
        run: node --test tools/backup-crypto.test.mjs
      - name: Offline privacy and accessible recovery smoke
        run: node --test tools/web-recovery.test.mjs
      - name: Pilot release NO_GO regression and reviewer evidence tests
        run: node --test tools/pilot-release-gate.test.mjs
      - name: Report pilot launch status without authorizing release
        run: node tools/pilot-release-gate.mjs
      - name: TypeScript checks
        run: npm run typecheck
      - name: Build Next.js UI
        run: npm run web:build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: ''
          NEXT_PUBLIC_AUTH0_DOMAIN: ''
          NEXT_PUBLIC_AUTH0_CLIENT_ID: ''
          NEXT_PUBLIC_AUTH0_AUDIENCE: ''
      - name: Serve production web build and verify 404/offline fallback
        run: |
          set -euo pipefail
          (cd apps/web && ../../node_modules/.bin/next start --hostname 127.0.0.1 --port 3180) > /tmp/sofra-web-smoke.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true; wait "$web_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3180/; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:3180/offline.html | grep -q 'İnternet bağlantısı kurulamadı'
          status="$(curl -sS -o /tmp/sofra-404.html -w '%{http_code}' http://127.0.0.1:3180/not-an-existing-route)"
          test "$status" = 404
          grep -q 'SAYFA BULUNAMADI' /tmp/sofra-404.html

  integration-postgres:
    name: PostgreSQL integration — real order, tenant isolation, availability
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: bismil_sofra_test
          POSTGRES_USER: sofra
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sofra -d bismil_sofra_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://sofra:ci-test-only-password@127.0.0.1:5432/bismil_sofra_test
      INTEGRATION_DATABASE_URL: postgresql://sofra:ci-test-only-password@127.0.0.1:5432/bismil_sofra_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run checksum-verified migrations
        run: node --experimental-strip-types apps/api/src/migrate.ts
      - name: Seed fictional test records only
        run: node --experimental-strip-types apps/api/integration/seed-test-db.ts
      - name: Check order lifecycle with a real PostgreSQL 17 server
        run: node --experimental-strip-types --test apps/api/integration/postgres.integration.ts
      - name: Check 30 concurrent durable order transactions and retry safety
        run: node --experimental-strip-types --test apps/api/integration/concurrent-orders.integration.ts
      - name: Check real HTTP API, signed JWT, isolation and notification recovery
        run: node --experimental-strip-types --test apps/api/integration/http.integration.ts
      - name: Two signed JWT HTTP replicas, cross-replica retries and database SSE
        run: node --experimental-strip-types --test apps/api/integration/multi-replica.integration.ts
      - name: Build and smoke-test production API Docker image (intake must stay closed)
        run: |
          set -euo pipefail
          docker build -f apps/api/Dockerfile -t bismil-sofra-api:ci .
          docker run -d --rm --network host --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop=ALL --security-opt=no-new-privileges --name sofra-api-ci \
            -e NODE_ENV=production -e API_BIND_HOST=0.0.0.0 -e PORT=4188 \
            -e "DATABASE_URL=$DATABASE_URL" \
            -e CORS_ORIGIN=https://sofra-ci.example.invalid \
            -e OIDC_ISSUER=https://issuer-ci.example.invalid/ \
            -e OIDC_AUDIENCE=sofra-ci \
            -e OIDC_JWKS_URL=https://issuer-ci.example.invalid/.well-known/jwks.json \
            bismil-sofra-api:ci
          trap 'docker stop --time 25 sofra-api-ci >/dev/null 2>&1 || true' EXIT
          if ! node tools/docker-smoke.mjs; then
            docker logs --tail 80 sofra-api-ci || true
            exit 1
          fi
      - name: Concurrent local-only HTTP load smoke (fictional data)
        env:
          NODE_ENV: test
          API_BIND_HOST: 127.0.0.1
          PORT: '4189'
          CORS_ORIGIN: http://127.0.0.1:3000
          OIDC_ISSUER: http://127.0.0.1:9999/
          OIDC_AUDIENCE: load-smoke-fixture
          OIDC_JWKS_URL: http://127.0.0.1:9999/.well-known/jwks.json
          LOCAL_LOAD_BASE_URL: http://127.0.0.1:4189
          LOCAL_LOAD_REQUESTS: '160'
          LOCAL_LOAD_CONCURRENCY: '40'
        run: |
          set -euo pipefail
          node --experimental-strip-types apps/api/src/server.ts > /tmp/sofra-load-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; wait "$api_pid" 2>/dev/null || true' EXIT
          if ! npm --workspace apps/api run test:load-local; then
            tail -n 60 /tmp/sofra-load-api.log
            exit 1
          fi
      - name: Local 50, 100, 200 concurrent GET capacity profiles
        run: bash tools/local-capacity-profiles.sh
      - name: Dump and restore disposable PostgreSQL 17 fixture
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          RESTORE_DATABASE_URL: postgresql://sofra:ci-test-only-password@127.0.0.1:5432/bismil_sofra_restore_test
        run: |
          set -euo pipefail
          test -n "$POSTGRES_CONTAINER_ID"
          backup_dir="$(mktemp -d)"
          trap 'rm -rf "$backup_dir"; docker exec "$POSTGRES_CONTAINER_ID" rm -f /tmp/bismil_sofra_ci.dump >/dev/null 2>&1 || true' EXIT
          export SOFRA_BACKUP_KEY_B64="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64"))')"
          docker exec "$POSTGRES_CONTAINER_ID" pg_dump -U sofra -d bismil_sofra_test -Fc | node tools/backup-crypto.mjs seal-stdin "$backup_dir/bismil.enc"
          test -s "$backup_dir/bismil.enc"
          test ! -e "$backup_dir/bismil.dump"
          node tools/backup-crypto.mjs open "$backup_dir/bismil.enc" "$backup_dir/bismil.dump"
          docker cp "$backup_dir/bismil.dump" "$POSTGRES_CONTAINER_ID":/tmp/bismil_sofra_ci.dump
          docker exec "$POSTGRES_CONTAINER_ID" createdb -U sofra -T template0 bismil_sofra_restore_test
          docker exec "$POSTGRES_CONTAINER_ID" pg_restore --exit-on-error --no-owner --no-privileges -U sofra -d bismil_sofra_restore_test /tmp/bismil_sofra_ci.dump
          node --experimental-strip-types apps/api/integration/restore-check.ts
