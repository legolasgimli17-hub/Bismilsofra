name: Tests and frontend build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Core backend tests
        run: npm run test:api
      - name: Frontend cart tests
        run: npm run test:cart
      - name: Discovery and favorites tests
        run: npm run test:discovery
      - name: Merchant connection health tests
        run: npm run test:inbox
      - name: Merchant workflow tests
        run: npm run test:merchant
      - name: TypeScript checks
        run: npm run typecheck
      - name: Build Next.js UI
        run: npm run web:build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: ''
          NEXT_PUBLIC_AUTH0_DOMAIN: ''
          NEXT_PUBLIC_AUTH0_CLIENT_ID: ''
          NEXT_PUBLIC_AUTH0_AUDIENCE: ''

  integration-postgres:
    name: PostgreSQL integration — real order, tenant isolation, availability
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: bismil_sofra_test
          POSTGRES_USER: sofra
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sofra -d bismil_sofra_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://sofra:ci-test-only-password@127.0.0.1:5432/bismil_sofra_test
      INTEGRATION_DATABASE_URL: postgresql://sofra:ci-test-only-password@127.0.0.1:5432/bismil_sofra_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run checksum-verified migrations
        run: node --experimental-strip-types apps/api/src/migrate.ts
      - name: Seed fictional test records only
        run: node --experimental-strip-types apps/api/integration/seed-test-db.ts
      - name: Check order lifecycle with a real PostgreSQL 17 server
        run: node --experimental-strip-types --test apps/api/integration/postgres.integration.ts
      - name: Check real HTTP API, signed JWT, isolation and notification recovery
        run: node --experimental-strip-types --test apps/api/integration/http.integration.ts
