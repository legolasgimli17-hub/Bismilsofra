name: Self-hosted identity proof
on:
  pull_request:
    paths:
      - '.github/workflows/self-hosted-identity.yml'
      - 'tools/self-hosted-identity-proof.mjs'
      - 'tools/fixtures/keycloak-ci-realm.json'
      - 'apps/api/src/auth.ts'
permissions:
  contents: read
jobs:
  signed-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Verify isolated password and OTP sign-ins
        shell: bash
        run: |
          set -euo pipefail
          fixture=$(mktemp -d)
          trap 'docker rm -f sofra-ci-identity >/dev/null 2>&1 || true; rm -rf "$fixture"' EXIT
          node tools/self-hosted-identity-proof.mjs prepare "$fixture"
          docker run -d --name sofra-ci-identity -p 127.0.0.1:8180:8080 \
            -e KC_HOSTNAME=http://127.0.0.1:8180 \
            -v "$fixture/sofra-ci-realm.json:/opt/keycloak/data/import/sofra-ci-realm.json:ro" \
            quay.io/keycloak/keycloak:26.8.2 start-dev --import-realm
          for attempt in {1..90}; do
            if curl -fsS http://127.0.0.1:8180/realms/sofra-ci/.well-known/openid-configuration -o /dev/null 2>/dev/null; then break; fi
            sleep 2
          done
          node --experimental-strip-types tools/self-hosted-identity-proof.mjs check "$fixture"
